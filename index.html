<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Darts-trainer</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/app.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="settings_panel">
    <div id="select_player_1"></div>
    <div id="select_player_2"></div>
    <div>
        <button class="start_at settings-btn" type="button" data-start-at="170">170</button>
        <button class="start_at settings-btn" type="button" data-start-at="301">301</button>
        <button class="start_at settings-btn default" type="button" data-start-at="501">501</button>
    </div>
    <div>
        <button class="best_of setting-btn" type="button" id="best_of_3" data-best-of="3">Best of 3</button>
        <button class="best_of setting-btn default" type="button" id="best_of_5" data-best-of="5">Best of 5</button>
    </div>
    <div>
        <button class="setting-btn game-on" id="game_on">Game On</button>
    </div>
</div>
<div id="bull_panel" class="noShow">
    <h3>Who won the bull?</h3>
    <button class="bull_winner" type="button" id="bull_player_1"></button>
    <button class="bull_winner" type="button" id="bull_player_2"></button>
</div>
<div id="game_panel" class="noShow">
    <div id="bull_winner" class="MyTurn"></div>
    <div id="bull_lozer"></div>
    <div id="key_pad">
        <div id="key_pad_screen"></div>
        <div class="key_pad_key" data-number="1">1</div>
        <div class="key_pad_key" data-number="2">2</div>
        <div class="key_pad_key" data-number="3">3</div>
        <div class="key_pad_key" data-number="4">4</div>
        <div class="key_pad_key" data-number="5">5</div>
        <div class="key_pad_key" data-number="6">6</div>
        <div class="key_pad_key" data-number="7">7</div>
        <div class="key_pad_key" data-number="8">8</div>
        <div class="key_pad_key" data-number="9">9</div>
        <div class="key_pad_key" data-number="B">B</div>
        <div class="key_pad_key" data-number="0">0</div>
        <div class="key_pad_key" data-number="E">E</div>
    </div>
</div>
</body>
</html>
