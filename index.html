<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Darts-trainer</title>
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/app.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div id="settings-panel">
    <div>
        <input class="player" type="text" data-id="player_1" placeholder="Player 1">
    </div>
    <div>
        <input class="player" type="text" data-id="player_2" placeholder="Player 2">
    </div>
    <div>
        <button class="start_at settings-btn" type="button" data-start-at="170">170</button>
        <button class="start_at settings-btn" type="button" data-start-at="301">301</button>
        <button class="start_at settings-btn default" type="button" data-start-at="501">501</button>
    </div>
    <div>
        <button class="best_of setting-btn" type="button" id="best_of_3" data-best-of="3">Best of 3</button>
        <button class="best_of setting-btn default" type="button" id="best_of_5" data-best-of="5">Best of 5</button>
    </div>
    <div>
        <button class="setting-btn game-on" id="game_on">Game On</button>
    </div>
</div>
<div id="bull_panel"></div>
<button id="test">TEST</button>
</body>
</html>
